[project]
name = "puding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "sboy99", email = "shadowboy191@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi>=0.162.2",
  "langchain>=1.4.9",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-openai>=1.7.4",
  "langgraph>=1.2.20",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "python-dotenv>=1.2.4",
  "uvicorn>=0.54.0",
]

[project.scripts]
puding = "src.puding.cli:main"
server = "src.puding.server:main"

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30.0"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0"]
